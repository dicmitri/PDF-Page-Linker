<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDF Page Linker</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="header">
      <h1>PDF Page Linker</h1>
      <p class="hint">Select text in a PDF, right-click, and choose a link.</p>
    </header>

    <section id="result" class="card" hidden aria-live="polite">
      <h2 id="resultTitle"></h2>
      <p id="resultMessage" class="message"></p>
      <div id="candidates" class="candidates"></div>
      <div id="resultLinkRow" class="link-row" hidden>
        <code id="resultLink" class="link"></code>
        <button id="copyAgain" type="button" class="button">Copy</button>
      </div>
      <p id="resultMeta" class="meta"></p>
    </section>

    <section id="manual" class="card" hidden>
      <h2>Link to a page</h2>
      <form id="manualForm" class="manual-form">
        <label for="manualPage">Page</label>
        <input id="manualPage" type="number" min="1" inputmode="numeric" required>
        <button type="submit" class="button primary">Copy link</button>
      </form>
      <p id="manualHint" class="meta"></p>
    </section>

    <section class="card history">
      <h2>Recent links</h2>
      <p id="emptyHistory" class="meta" hidden>No links yet.</p>
      <ol id="historyList" class="history-list"></ol>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
